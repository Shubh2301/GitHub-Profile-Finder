<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen text-white font-sans bg-black">
  <div class="max-w-4xl mx-auto py-16 px-6">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-300 text-transparent bg-clip-text">
        GitHub Explorer
      </h1>
      <p class="text-gray-400 mt-3 animate-pulse">Search any GitHub user and explore their profile.</p>
    </div>

    <!-- Search Card -->
    <div class="backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl rounded-2xl p-8">
      <form id="search-form" class="flex flex-col sm:flex-row gap-4">
        <input id="search-input" type="text" placeholder="Search GitHub username…" class=" username flex-1 px-5 py-4 rounded-xl bg-white/5 border border-white/10 placeholder-gray-400 shadow-inner focus:ring-2 focus:ring-indigo-500 outline-none transition" />
        <button type="submit" class="search px-8 py-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 rounded-xl font-semibold shadow-lg transition">Search</button>
      </form>
    </div>

    <!-- Skeleton Loader -->
    <div id="loader" class="mt-12 hidden animate-pulse">
      <div class="bg-white/10 border border-white/20 rounded-3xl p-10">
        <div class="flex flex-col sm:flex-row gap-8 items-center">
          <div class="w-36 h-36 bg-white/20 rounded-2xl"></div>
          <div class="flex-1 space-y-3">
            <div class="h-6 bg-white/20 w-1/2 rounded"></div>
            <div class="h-4 bg-white/15 w-1/3 rounded"></div>
            <div class="h-4 bg-white/10 w-full rounded mt-4"></div>
            <div class="h-4 bg-white/10 w-5/6 rounded"></div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-6 mt-10 ">
          <div class="h-20 bg-white/10 rounded-2xl"></div>
          <div class="h-20 bg-white/10 rounded-2xl"></div>
          <div class="h-20 bg-white/10 rounded-2xl"></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-6 mt-10">
          <div class="h-4 bg-white/10 rounded"></div>
          <div class="h-4 bg-white/10 rounded"></div>
          <div class="h-4 bg-white/10 rounded"></div>
          <div class="h-4 bg-white/10 rounded"></div>
        </div>
      </div>
    </div>

    <!-- Result Card -->
    <div id="result-card" class=" mt-12 hidden">
      <div class="card backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl rounded-3xl p-10" id="result-content"></div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
